name: Build all pinned localized versions (manual, no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-localization-releases
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - run: python -m unittest discover -s tests -v
      - run: echo 'Validation only; no release created, changed, or published.' >> "$GITHUB_STEP_SUMMARY"
