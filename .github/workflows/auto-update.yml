name: Check official latest (manual, metadata only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-metadata-sync
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/automation/discover.py
